{% extends 'catalogo/components/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0 text-center" style="width: 100%; max-width: 500px;">
        <div class="card-body p-5">
            <i class="bi bi-check-circle display-1 text-success mb-3"></i>
            <h3 class="fw-bold text-dark">¡Contraseña Actualizada!</h3>
            <p class="text-muted mt-3">Tu nueva contraseña está lista. Ya puedes iniciar sesión con ella.</p>
            <a href="{% url 'login' %}" class="btn btn-dark mt-3 fw-bold"><i class="bi bi-arrow-left-circle-fill"></i> Ir al Login</a>
        </div>
    </div>
</div>
{% endblock %}
