{% extends 'catalogo/base.html' %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark"><i class="bi bi-pencil-square"></i> Editar Ejecutivo</h2>
            <p class="text-muted mb-0">Modificando la cuenta de <strong>{{ integrante.username }}</strong></p>
        </div>
        <a href="{% url 'gestion_personal' %}" class="btn btn-outline-secondary">Volver al Equipo</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-person-gear"></i> Datos del Ejecutivo</h5>
                </div>
                <div class="card-body bg-light">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Nombre de Usuario (no editable)</label>
                            <input type="text" class="form-control" value="{{ integrante.username }}" disabled>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-bold small">Nombre</label>
                                <input type="text" name="first_name" class="form-control"
                                    value="{{ integrante.first_name }}" required>
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold small">Apellido</label>
                                <input type="text" name="last_name" class="form-control"
                                    value="{{ integrante.last_name }}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" value="{{ integrante.email }}" required>
                        </div>
                        <hr class="my-4">
                        <div class="alert alert-warning small py-2 mb-3">
                            <i class="bi bi-shield-lock"></i><strong> Resetear contraseña</strong> (opcional)
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small">Nueva Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="Dejar en blanco para no cambiar">
                            <small class="text-muted">Si escribes algo aquí, la clave actual del ejecutivo quedará invalidada.</small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="bi bi-save"></i> Guardar Cambios
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
