{% extends 'catalogo/base.html' %}

{% block content %}
<style>
    /*Estilos para que el form de django utilice el estilo de bootstrap*/
    .django-form input {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #f8f9fa;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        margin-bottom: 1rem;
    }

    .django-form label {
        font-weight: 600;
        margin-bottom: 0.2rem;
    }

    .django-form ul.errorlist {
        color: #dc3545;
        font-size: 0.875rem;
        list-style-type: none;
        padding-left: 0;
        margin-top: -0.5rem;
        margin-bottom: 1rem;
    }

    .django-form .helptext {
        font-size: 0.8rem;
        color: #6c757d;
        display: block;
        margin-top: -0.8rem;
        margin-bottom: 1rem;
    }
</style>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 400;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">HunarPack B2B</h3>
                <p class="text-muted">Acceso Clientes</p>
            </div>
            <!-- Formulario de Inicio de Sesión -->
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <input type="text" name="username" class="form-control bg-light">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control bg-light">
                </div>
                <button type="submit" class="btn btn-dark w-100 fw-bold mb-3">Ingresar al Portal Cliente</button>
                <div class="text-center mt-2 mb-2">
                    <a href="{% url 'password_reset' %}" class="text-muted small text-decoration-none">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <div class="text-center mt-4">
                    <small class="text-muted">¿Eres un cliente nuevo? <a href="{% url 'registro' %}"
                            class="text-dark fw-bold text-decoration-none">Regístrate aquí</a></small>
                </div>
            </form>
            <!-- Control de Errores -->
            {% if form.errors %}
            <div class="alert alert-danger text-center p-2 mb-0" role="alert">
                <small class="fw-semibold">Usuario o contraseña incorrectos. Por favor, inténtelo de nuevo.</small>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
