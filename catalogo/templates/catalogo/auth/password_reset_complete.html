{% extends 'catalogo/components/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow-lg border-0 text-center" style="width: 100%; max-width: 500px;">
        <div class="card-body p-4 p-sm-5">
            <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 90px; height: 90px;">
                <i class="bi bi-check-circle-fill display-4" style="color: #7BA356;"></i>
            </div>
            <h3 class="fw-bold text-dark mb-3">¡Contraseña Actualizada!</h3>
            <p class="text-muted mb-4" style="line-height: 1.6;">
                Tu nueva contraseña está lista y tu cuenta está segura. Ya puedes ingresar al portal con tus nuevas credenciales.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ir al Login
            </a> 
        </div>
    </div>
</div>
{% endblock %}
