{% extends 'catalogo/components/base.html' %}

{% block content %}
<style>
    /*Estilos para que el form de django utilice el estilo de bootstrap*/
    .django-form p {
        margin-bottom: 1rem;
    }
    .django-form input {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #f8f9fa;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
    }
    .django-form input:focus {
        border-color: #7BA356;
        box-shadow: 0 0 0 0.25rem rgba(123, 163, 86, 0.25);
        outline: 0;
    }
    .django-form label {
        font-weight: 600;
        margin-bottom: 0.3rem;
        font-size: 0.9rem;
        color: #2F3E2A;
    }
    .django-form ul.errorlist {
        color: #dc3545;
        font-size: 0.875rem;
        list-style-type: none;
        padding-left: 0;
        margin-top: 0.3rem;
        margin-bottom: 0.5rem;
    }
    .django-form .helptext {
        font-size: 0.8rem;
        color: #6c757d;
        display: block;
        margin-top: 0.2rem;
        margin-bottom: 0.5rem;
        line-height: 1.3;
    }
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 500px;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 70px; height: 70px;">
                    <i class="bi bi-shield-lock display-5" style="color: #7BA356;"></i>
                </div>
                <h3 class="fw-bold text-dark">Cambiar Contraseña</h3>
                <p class="text-muted small">Actualiza tu clave de acceso al portal de clientes HunarPack.</p>
            </div>

            <form class="django-form" method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-3 mb-3 shadow-sm">
                    <i class="bi bi-check-circle"></i> Actualizar Contraseña
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'lista_categorias' %}" class="text-muted small text-decoration-none hover-link">
                    <i class="bi bi-arrow-left"></i> Volver al catálogo
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .hover-link:hover {
        color: #7BA356 !important;
        transition: color 0.2s ease;
    }
</style>
{% endblock %}
