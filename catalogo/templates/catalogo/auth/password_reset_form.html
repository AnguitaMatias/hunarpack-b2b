{% extends 'catalogo/components/base.html' %}

{% block content %}
<style>
    /*Estilos para que el form de django utilice el estilo de bootstrap*/
    .django-form input {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #f8f9fa;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        margin-bottom: 1rem;
    }

    .django-form label {
        font-weight: 600;
        margin-bottom: 0.2rem;
    }

    .django-form ul.errorlist {
        color: #dc3545;
        font-size: 0.875rem;
        list-style-type: none;
        padding-left: 0;
        margin-top: -0.5rem;
        margin-bottom: 1rem;
    }

    .django-form .helptext {
        font-size: 0.8rem;
        color: #6c757d;
        display: block;
        margin-top: -0.8rem;
        margin-bottom: 1rem;
    }
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark"><i class="bi bi-envelope"></i> Recuperar Contraseña</h3>
                <p class="text-muted">Ingresa tu correo electrónico y te enviaremos un enlace seguro.</p>
            </div>

            <form method="POST" class="django-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 fw-bold mt-2 mb-3">Enviar enlace de recuperación</button>
            </form>

            <div class="text-center">
                <a href="{% url 'login' %}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left-circle-fill"></i> Volver al login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
