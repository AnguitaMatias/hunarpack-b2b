{% extends 'catalogo/components/base.html' %}

{% block content %}
<style>
    .form-control:focus {
        border-color: #7BA356;
        box-shadow: 0 0 0 0.25rem rgba(123, 163, 86, 0.15);
    }

    .input-group:focus-within .input-group-text {
        border-color: #7BA356;
        color: #7BA356 !important;
    }

    .errorlist {
        color: #dc3545;
        font-size: 0.8rem;
        list-style-type: none;
        padding-left: 0;
        margin-top: 0.3rem;
        margin-bottom: 0;
    }
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 450px;">

        <!-- Padding responsivo -->
        <div class="card-body p-4 p-sm-5">

            <!-- Cabecera -->
            <div class="text-center mb-4">
                <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                    style="width: 70px; height: 70px;">
                    <i class="bi bi-shield-lock display-5" style="color: #7BA356;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Recuperar Contraseña</h3>
                <p class="text-muted small">Ingresa tu correo y te enviaremos un enlace seguro para restablecer tu
                    clave.</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <!-- Campo Email -->
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-envelope text-secondary"></i></span>
                        <!-- El input debe llamarse 'email' porque es el campo que espera PasswordResetView -->
                        <input type="email" name="email" class="form-control bg-light border-start-0 ps-0"
                            placeholder="tu@empresa.cl" required autofocus>
                    </div>

                    <!-- Manejo de errores del campo email (ej: si el formato es inválido) -->
                    {% if form.email.errors %}
                    <div class="errorlist">{{ form.email.errors.0 }}</div>
                    {% endif %}
                </div>

                <!-- Botón Principal -->
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">
                    <i class="bi bi-send me-1"></i> Enviar enlace de recuperación
                </button>
            </form>

            <hr class="my-4 text-muted opacity-25">

            <!-- Volver al Login -->
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-muted small text-decoration-none fw-semibold hover-primary">
                    <i class="bi bi-arrow-left-circle me-1"></i> Volver al login
                </a>
            </div>

        </div>
    </div>
</div>

<style>
    .hover-primary:hover {
        color: #7BA356 !important;
        transition: color 0.2s ease;
    }
</style>
{% endblock %}
